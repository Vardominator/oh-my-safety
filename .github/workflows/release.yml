name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml

  distribution:
    name: Distribution gates
    uses: ./.github/workflows/distribution.yml

  snap:
    name: Snap packages
    uses: ./.github/workflows/snap.yml

  release:
    name: Publish release
    needs: [ci, distribution, snap]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download validated Linux packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: linux-packages
          path: dist

      - name: Download validated Snap packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: oh-my-safety-snap-*
          path: dist
          merge-multiple: true

      - name: Verify tag matches OMS_VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^OMS_VERSION="\([^"]*\)"/\1/p' lib/core.sh)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match OMS_VERSION $version"
            exit 1
          fi

      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/verify-github-tag.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" \
            "$(git rev-parse HEAD)"

      - name: Checksum the immutable tag source archive
        id: sha
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" -o source.tar.gz; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::tag source archive was not available"
              exit 1
            fi
            sleep 5
          done
          sha=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          printf '%s  %s\n' "$sha" "${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}.tar.gz" >checksums.txt
          find dist -maxdepth 1 -type f -print0 |
            sort -z |
            xargs -0 sha256sum |
            sed 's#  dist/#  #' >>checksums.txt

      - name: Create or resume draft, attach assets, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes_file="docs/releases/${tag}.md"
          test -f "$notes_file" || {
            echo "::error::missing curated release notes: $notes_file"
            exit 1
          }
          artifacts=(
            checksums.txt
            dist/*.deb
            dist/*.rpm
            dist/*.snap
            dist/*.tar.gz
          )
          for artifact in "${artifacts[@]}"; do
            test -f "$artifact"
          done

          release_json="$(
            gh release view "$tag" \
              --json assets,isDraft,isImmutable,tagName 2>/dev/null || true
          )"
          if [ -z "$release_json" ]; then
            # An explicit draft makes interrupted uploads safely resumable.
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "oh-my-safety $tag" \
              --notes-file "$notes_file"
            release_json="$(
              gh release view "$tag" \
                --json assets,isDraft,isImmutable,tagName
            )"
          fi

          is_draft="$(printf '%s' "$release_json" | jq -r .isDraft)"
          is_immutable="$(printf '%s' "$release_json" | jq -r .isImmutable)"
          test "$(printf '%s' "$release_json" | jq -r .tagName)" = "$tag"

          if [ "$is_draft" = true ]; then
            gh release upload "$tag" "${artifacts[@]}" --clobber

            expected_names="$(
              for artifact in "${artifacts[@]}"; do
                basename "$artifact"
              done | LC_ALL=C sort
            )"
            actual_names="$(
              gh release view "$tag" --json assets \
                --jq '.assets[].name' |
                LC_ALL=C sort
            )"
            test "$actual_names" = "$expected_names" || {
              echo "::error::draft release contains an unexpected asset set"
              diff -u \
                <(printf '%s\n' "$expected_names") \
                <(printf '%s\n' "$actual_names") || true
              exit 1
            }

            draft_download="$RUNNER_TEMP/release-draft-assets"
            rm -rf "$draft_download"
            mkdir -p "$draft_download"
            gh release download "$tag" --dir "$draft_download"
            for artifact in "${artifacts[@]}"; do
              cmp "$artifact" "$draft_download/$(basename "$artifact")"
            done

            gh release edit "$tag" --draft=false --verify-tag
          elif [ "$is_immutable" != true ]; then
            echo "::error::existing published release is not immutable"
            exit 1
          fi

          test "$(
            gh release view "$tag" \
              --json isDraft,isImmutable \
              --jq '(.isDraft == false and .isImmutable == true)'
          )" = true
          gh release verify "$tag"

          # Verify the locked remote assets instead of assuming a rerun will
          # reproduce byte-identical package timestamps.
          published_download="$RUNNER_TEMP/release-published-assets"
          rm -rf "$published_download"
          mkdir -p "$published_download"
          gh release download "$tag" --dir "$published_download"

          expected_names="$(
            for artifact in "${artifacts[@]}"; do
              basename "$artifact"
            done | LC_ALL=C sort
          )"
          actual_names="$(
            find "$published_download" -maxdepth 1 -type f -exec basename {} \; |
              LC_ALL=C sort
          )"
          test "$actual_names" = "$expected_names"

          for artifact in "$published_download"/*; do
            gh release verify-asset "$tag" "$artifact"
          done

          source_name="${GITHUB_REPOSITORY##*/}-${tag}.tar.gz"
          curl -fsSL \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz" \
            -o "$published_download/$source_name"
          (
            cd "$published_download"
            sha256sum --check checksums.txt
          )

  formula-pr:
    name: Open Homebrew formula PR
    needs: release
    if: vars.FORMULA_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # A GitHub App token is intentional: pushes made with GITHUB_TOKEN do not
      # trigger the PR validation workflows, and repositories can prohibit that
      # token from opening pull requests.
      - name: Create scoped release-app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.FORMULA_APP_ID }}
          private-key: ${{ secrets.FORMULA_APP_PRIVATE_KEY }}

      - name: Update formula and open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          formula=Formula/oh-my-safety.rb
          branch="formula-bump-${GITHUB_REF_NAME}"

          sed -i "s|/archive/refs/tags/v[0-9.]*\.tar\.gz|/archive/refs/tags/v${version}.tar.gz|" "$formula"
          sed -i "s|sha256 \"[^\"]*\"|sha256 \"${RELEASE_SHA}\"|" "$formula"

          if git diff --quiet -- "$formula"; then
            echo "Formula is already current on main."
            exit 0
          fi

          gh auth setup-git
          remote_sha=""
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            remote_sha=$(git rev-parse "origin/$branch")
          fi

          git config user.name "oh-my-safety-release[bot]"
          git config user.email "oh-my-safety-release[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add "$formula"
          git commit -m "Update formula for ${GITHUB_REF_NAME}"

          if [ -n "$remote_sha" ]; then
            git push --set-upstream \
              --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "$branch"
          else
            git push --set-upstream origin "$branch"
          fi

          if gh pr view "$branch" --json url --jq .url >/dev/null 2>&1; then
            gh pr view "$branch" --json url --jq .url
          else
            gh pr create --base main --head "$branch" \
              --title "Update formula for ${GITHUB_REF_NAME}" \
              --body "Automated immutable-source checksum update for ${GITHUB_REF_NAME}. All CI and distribution gates must pass before merge."
          fi
